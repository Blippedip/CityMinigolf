    :root{--night:#0d0d12;--wall:#15151f;--red:#ed1c24;--uv:#8b5cff;--cyan:#2de2ff;--pink:#ff2fa0;--sheet:#0d0d12;--ink:#fff;--soft:#b4b4c8;--card:#1a1a26;--line:#2c2c40;--display:Anton,Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--sheet);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
    .hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:clamp(28px,5vw,72px) 18px max(150px,calc(10vw + 30px));flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 60% 70% at 15% 10%,rgba(139,92,255,.45),transparent 70%),radial-gradient(ellipse 55% 60% at 90% 30%,rgba(255,47,160,.32),transparent 70%),var(--night)}
    .hero-in{position:relative;z-index:2;width:min(760px,100%);margin:auto}
    h1{font-family:var(--display);font-weight:400;font-size:clamp(3.8rem,17vw,11rem);line-height:.9;letter-spacing:.015em;margin:0;text-transform:uppercase;transform:rotate(-3deg);text-shadow:0 0 28px rgba(237,28,36,.7),4px 4px 0 var(--red)}
    .drip{display:block;width:min(300px,62%);height:22px;margin:10px auto 0;transform:rotate(-3deg)}
    .intro{margin:18px 0 0;font-size:1.1rem;line-height:1.4;color:#d9d9e6}
    .intro:empty{display:none}
    .sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:190px;z-index:1}
    .win{animation:on .5s steps(2,end) both}
    @keyframes on{from{opacity:0}to{opacity:1}}
    .tape{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 16px,var(--night) 16px 32px)}
    .wrap{width:min(760px,100%);margin:0 auto;padding:36px 18px 36px}
    .languages{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
    button{font:inherit;cursor:pointer}
    .lang{display:flex;align-items:center;gap:13px;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);width:100%;padding:16px 18px;border-radius:22px;font-weight:800;font-size:1.15rem;transition:background .15s,color .15s,border-color .15s}
    .lang::after{content:"";margin-left:auto;width:10px;height:10px;border-top:3px solid var(--red);border-right:3px solid var(--red);transform:rotate(45deg);flex:none}
    .lang:hover,.lang:focus-visible{background:#26171f;border-color:var(--red);box-shadow:0 0 18px rgba(237,28,36,.35);outline:none}
    .lang:focus-visible{outline:3px solid var(--uv);outline-offset:3px}
    .flag{font-size:1.9rem;line-height:1}
    .lang small{display:block;color:var(--soft);font-weight:500;font-size:.78rem;margin-top:2px}
    .lang:hover small,.lang:focus-visible small{color:#bdbdd0}
    .rules{display:none}
    .rules.active{display:block}
    .rules-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .rules-head h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,2.8rem);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
    .back{border:2px solid var(--line);background:transparent;color:#fff;border-radius:999px;padding:11px 16px;font-size:.9rem;font-weight:700;white-space:nowrap}
    .back:hover{background:var(--red);border-color:var(--red)}
    .back:focus-visible{outline:3px solid var(--uv);outline-offset:3px}
    .rule{display:grid;grid-template-columns:54px 1fr;gap:15px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
    .num{width:50px;height:50px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--uv)}
    .rule h3{font-size:1.08rem;margin:2px 0 5px}
    .rule p{margin:0;color:var(--soft);line-height:1.55}
    .rule.warn{background:var(--red);border-color:var(--red);color:#fff;position:relative;overflow:hidden;padding-top:26px}
    .rule.warn::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(-45deg,#fff 0 10px,var(--night) 10px 20px)}
    .rule.warn p{color:#fff}
    .ui{font-style:normal;font-weight:800;color:var(--cyan);background:#262638;border:1px solid #44445e;border-radius:8px;padding:1px 7px;white-space:nowrap}
    .rule.warn .ui{color:#fff;background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.55)}
    .rule.warn .num{background:#fff;color:var(--red);box-shadow:0 0 0 3px var(--red),0 0 0 6px #fff}
    .notice{background:var(--night);color:#fff;border-radius:24px;padding:22px 20px;margin-top:20px;line-height:1.5;box-shadow:0 0 0 2px var(--uv),0 0 26px rgba(139,92,255,.5)}
    .notice strong{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;letter-spacing:.02em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
    @media(min-width:600px){.wrap{padding-top:44px}}
    @media(prefers-reduced-motion:reduce){.win{animation:none}.lang{transition:none}}
  </style>
</head>

const $=id=>document.getElementById(id);
const languages=$('languages'),chooser=$('chooser'),rules=$('rules'),ruleList=$('rule-list'),back=$('back'),intro=$('intro');
const introDefault=intro.innerHTML;

// Skyline van de verlaten stad, met ramen die aangaan
(function(){
  let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
  const cols=['#2de2ff','#ff2fa0','#ffb347','#8b5cff'];
  let x=-10,h='';
  while(x<1200){
    const w=44+(r()*60|0),ht=40+(r()*80|0),y=190-ht;
    h+=`<rect x="${x}" y="${y}" width="${w-3}" height="${ht}" fill="#15151f"/>`;
    for(let wy=y+10;wy<182;wy+=16)for(let wx=x+7;wx<x+w-12;wx+=14)
      if(r()<.3)h+=`<rect class="win" style="animation-delay:${(r()*2.6).toFixed(2)}s" x="${wx}" y="${wy}" width="6" height="8" fill="${cols[r()*4|0]}"/>`;
    x+=w;
  }
  $('sky').innerHTML=h;
})();

function showLanguage(code){
  const d=content[code];document.documentElement.lang=code;
  $('rules-title').textContent=d.title;
  back.textContent=d.back;
  intro.textContent=d.subtitle;
  $('notice').innerHTML=d.notice;
  ruleList.replaceChildren();
  d.rules.forEach((r,i)=>{
    const article=document.createElement('article');article.className='rule'+(i===2?' warn':'');
    const num=document.createElement('div');num.className='num';num.textContent=String(i+1);
    const body=document.createElement('div');
    const h=document.createElement('h3');h.textContent=r[0];
    const p=document.createElement('p');p.innerHTML=r[1];
    body.append(h,p);article.append(num,body);ruleList.append(article);
  });
  chooser.hidden=true;rules.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});
}
Object.entries(content).forEach(([code,d])=>{
  const b=document.createElement('button');b.className='lang';b.type='button';
  b.innerHTML=`<span class="flag" aria-hidden="true">${d.flag}</span><span>${d.native}<small>${d.name}</small></span>`;
  b.addEventListener('click',()=>showLanguage(code));languages.append(b);
});
back.addEventListener('click',()=>{rules.classList.remove('active');chooser.hidden=false;intro.innerHTML=introDefault;document.documentElement.lang="nl";window.scrollTo({top:0,behavior:'smooth'});});
</script>
